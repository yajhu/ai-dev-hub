<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Task — AI Dev Hub</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <nav class="navbar">
        <div class="navbar-inner">
            <a th:href="@{/}" class="navbar-logo">AI Dev Hub</a>
            <ul class="navbar-nav">
                <li><a th:href="@{/}">Projects</a></li>
                <li><a th:href="@{/tasks}">Tasks</a></li>
            </ul>
        </div>
    </nav>

    <main class="main">
        <div class="container">
            <!-- Breadcrumb -->
            <div class="breadcrumb">
                <a th:href="@{/}">AI Dev Hub</a>
                <span class="sep">/</span>
                <th:block th:if="${project != null}">
                    <a th:href="@{/tasks(projectId=${project.id})}" th:text="${project.name}">Project</a>
                    <span class="sep">/</span>
                </th:block>
                <a th:href="@{/tasks(projectId=${projectId})}">Tasks</a>
                <span class="sep">/</span>
                <span class="current">Create Task</span>
            </div>

            <div class="card form-card">
                <h1 style="font-size:1.5rem;font-weight:700;margin-bottom:24px;">Create New Task</h1>

                <form th:action="@{/tasks}" method="post">
                    <!-- Hidden projectId -->
                    <input type="hidden" name="projectId" th:value="${projectId}">

                    <!-- Title -->
                    <div class="form-group">
                        <label class="form-label" for="title">Title</label>
                        <input type="text" id="title" name="title"
                               class="form-input" placeholder="Task title"
                               required maxlength="300">
                    </div>

                    <!-- Description -->
                    <div class="form-group">
                        <label class="form-label" for="description">Description</label>
                        <textarea id="description" name="description"
                                  class="form-textarea"
                                  placeholder="Describe what the task should accomplish..."></textarea>
                    </div>

                    <!-- Acceptance Criteria -->
                    <div class="form-group">
                        <label class="form-label" for="acceptance">Acceptance Criteria</label>
                        <textarea id="acceptance" name="acceptance"
                                  class="form-textarea"
                                  placeholder="List the conditions for acceptance..."></textarea>
                        <div class="form-hint">One criterion per line. Used for validation during the review stage.</div>
                    </div>

                    <!-- Priority -->
                    <div class="form-group">
                        <label class="form-label" for="priority">Priority</label>
                        <select id="priority" name="priority" class="form-select" required>
                            <option value="HIGH">High</option>
                            <option value="MEDIUM" selected>Medium</option>
                            <option value="LOW">Low</option>
                        </select>
                    </div>

                    <!-- Source -->
                    <div class="form-group">
                        <label class="form-label" for="source">Source</label>
                        <select id="source" name="source" class="form-select">
                            <option value="MANUAL">Manual</option>
                            <option value="GITHUB_ISSUE">GitHub Issue</option>
                            <option value="SLACK">Slack</option>
                        </select>
                    </div>

                    <!-- AI Model -->
                    <div class="form-group">
                        <label class="form-label" for="aiModel">AI Model</label>
                        <select id="aiModel" name="aiModel" class="form-select">
                            <option value="">— Select Model —</option>
                            <option value="claude-opus-4.7">Claude Opus 4.7</option>
                            <option value="claude-sonnet-4.6">Claude Sonnet 4.6</option>
                            <option value="claude-haiku-4.5">Claude Haiku 4.5</option>
                            <option value="gpt-4o">GPT-4o</option>
                            <option value="deepseek-v4">DeepSeek V4</option>
                        </select>
                        <div class="form-hint">The AI model that will generate the code.</div>
                    </div>

                    <!-- Target Branch -->
                    <div class="form-group">
                        <label class="form-label" for="targetBranch">Target Branch</label>
                        <input type="text" id="targetBranch" name="targetBranch"
                               class="form-input" placeholder="main"
                               maxlength="100">
                        <div class="form-hint">Base branch for the PR. Defaults to the repository default.</div>
                    </div>

                    <!-- Buttons -->
                    <div class="flex-row mt-24">
                        <button type="submit" class="btn btn-primary">Create Task</button>
                        <a th:href="@{/tasks(projectId=${projectId})}" class="btn btn-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </main>
</body>
</html>
