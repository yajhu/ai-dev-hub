services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: aidevhub
      POSTGRES_USER: aidevhub
      POSTGRES_PASSWORD: aidevhub
    volumes:
      - pgdata_test:/var/lib/postgresql/data
      - ./src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aidevhub -d aidevhub"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile.test
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/aidevhub
      SPRING_DATASOURCE_USERNAME: aidevhub
      SPRING_DATASOURCE_PASSWORD: aidevhub
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: aidevhub
      DB_USER: aidevhub
      DB_PASSWORD: aidevhub

volumes:
  pgdata_test:
